[package]
name = "msir"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "msir"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["abi3-py39"] }
numpy = "0.27.0"
ndarray = "0.16"
rust-lapper = "1.2.0"
zarrs = { version = "0.22.10", features = ["ndarray"] }
zarrs_opendal = "0.11"
opendal = { version = "0.56", features = ["services-oss", "services-s3"] }
thiserror = "2"
rayon = "1.10"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
